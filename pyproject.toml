[project]
name = "decoding-core"
version = "0.1.0"
description = ""
authors = [
    {name = "Your Name",email = "you@example.com"}
]
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "pytest (>=9.2.0,<10.0.0)",
    "requests (>=2.34.2,<3.0.0)",
    "tqdm (>=4.70.1,<5.0.0)",
    "pypeline @ git+https://github.com/GuilhermeCosta-Ferreira/pypeline.git",
    "pyxdf (>=1.18.0,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "black (>=26.10.1,<27.0.0)",
    "pylint (>=4.1.3,<5.0.0)",
    "docformatter (>=1.7.8,<2.0.0)",
    "pyright (>=1.1.414,<2.0.0)",
    "ruff (>=0.17.4,<0.18.0)",
    "classpy @ git+https://github.com/GuilhermeCosta-Ferreira/ClassyPython.git"
]

[tool.docformatter]
recursive = true
in-place = true
wrap-summaries = 88
wrap-descriptions = 88
black = true

[tool.pylint."messages control"]
disable = [
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
]

[tool.classpy]
puml = "docs/diagrams/download.puml"
src  = "src/decoding/download"
